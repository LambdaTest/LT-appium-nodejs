name: Android Test

# This workflow runs the Android test using LambdaTest
on:
  push:
    branches: [ TTN-23587 ]
  pull_request:
    branches: [ TTN-23587 ]
  workflow_dispatch:

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
  LT_APP_ID: ${{ secrets.LT_APP_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Debug - Show directory contents
      run: |
        echo "Current directory contents:"
        ls -la
        echo "\nPackage files:"
        ls -la package*.json || true
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.20.8'
        cache: 'npm'
    
    - name: Debug - Show npm configuration
      run: |
        echo "NPM version:"
        npm --version
        echo "\nNPM config:"
        npm config list
        echo "\nNPM cache location:"
        npm config get cache
        echo "\nNode version:"
        node --version
    
    - name: Clean npm cache and node_modules
      run: |
        echo "Cleaning npm cache and node_modules..."
        rm -rf node_modules
        rm -f package-lock.json
        npm cache clean --force
    
    - name: Install dependencies directly
      run: |
        echo "Installing dependencies directly..."
        npm install --no-package-lock --verbose
        echo "\nInstalled packages:"
        npm list --depth=0
    
    - name: Install navigation tracker
      run: |
        mkdir -p packages
        curl -L https://github.com/srivishnua-lambdatest/lambdatest-js-sdk/raw/stage/packages/appium/appium-navigation-tracker-1.0.0.tgz -o packages/appium-navigation-tracker-1.0.0.tgz
        npm install ./packages/appium-navigation-tracker-1.0.0.tgz --no-package-lock --verbose
    
    - name: Debug - Show installation status
      run: |
        echo "Final package.json:"
        cat package.json
        echo "\nInstalled packages:"
        npm list --depth=0
        echo "\nNode modules contents:"
        ls -la node_modules
    
    - name: Configure LambdaTest credentials
      run: |
        echo "LT_USERNAME=${{ secrets.LT_USERNAME }}" >> $GITHUB_ENV
        echo "LT_ACCESS_KEY=${{ secrets.LT_ACCESS_KEY }}" >> $GITHUB_ENV
        echo "LT_APP_ID=${{ secrets.LT_APP_ID }}" >> $GITHUB_ENV
    
    - name: Run Android Test
      run: node Android.js
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        if-no-files-found: warn 