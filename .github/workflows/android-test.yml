name: Android Test

# This workflow runs the Android test using LambdaTest
on:
  push:
    branches: [ TTN-23587 ]
  pull_request:
    branches: [ TTN-23587 ]
  workflow_dispatch:

env:
  LT_USERNAME: ${{ secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
  LT_APP_ID: ${{ secrets.LT_APP_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Debug - Show directory contents
      run: |
        echo "Current directory contents:"
        ls -la
        echo "\nPackage files:"
        ls -la package*.json || true
        echo "\nPackages directory contents:"
        ls -la packages || true
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14.21.3'
        cache: 'npm'
    
    - name: Debug - Show npm configuration
      run: |
        echo "NPM version:"
        npm --version
        echo "\nNPM config:"
        npm config list
        echo "\nNPM cache location:"
        npm config get cache
        echo "\nNode version:"
        node --version
    
    - name: Clean npm cache and node_modules
      run: |
        echo "Cleaning npm cache and node_modules..."
        rm -rf node_modules
        rm -f package-lock.json
        npm cache clean --force
    
    - name: Install dependencies
      run: |
        echo "Installing dependencies..."
        npm install --verbose 2>&1 | tee npm-install.log
        echo "\nInstalled packages:"
        npm list --depth=0
      continue-on-error: true
    
    - name: Install navigation tracker from tgz
      run: |
        echo "Installing navigation tracker from tgz..."
        npm install packages/appium-navigation-tracker-1.0.0.tgz --verbose 2>&1 | tee npm-tracker-install.log
        echo "\nVerifying installation:"
        ls -la node_modules/appium-navigation-tracker || true
      continue-on-error: true
    
    - name: Debug - Show npm error logs
      if: failure()
      run: |
        echo "NPM debug log:"
        cat npm-debug.log || true
        echo "\nNPM error log:"
        cat npm-error.log || true
        echo "\nNPM install log:"
        cat npm-install.log || true
        echo "\nNPM tracker install log:"
        cat npm-tracker-install.log || true
        echo "\nDirectory contents after failure:"
        ls -la
        echo "\nNode modules contents:"
        ls -la node_modules || true
        echo "\nPackage.json contents:"
        cat package.json || true
        echo "\nPackages directory contents:"
        ls -la packages || true
    
    - name: Configure LambdaTest credentials
      run: |
        echo "LT_USERNAME=${{ secrets.LT_USERNAME }}" >> $GITHUB_ENV
        echo "LT_ACCESS_KEY=${{ secrets.LT_ACCESS_KEY }}" >> $GITHUB_ENV
        echo "LT_APP_ID=${{ secrets.LT_APP_ID }}" >> $GITHUB_ENV
    
    - name: Run Android Test
      run: |
        echo "Running Android test..."
        node Android.js 2>&1 | tee android-test.log
      continue-on-error: true
    
    - name: Debug - Show test logs
      if: failure()
      run: |
        echo "Android test log:"
        cat android-test.log || true
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        if-no-files-found: warn 